command:
- streamlit
- run
- app/streamlit_app.py

# The SQL warehouse (CAN_USE, id eafe19ac379b5437) is attached to this app
# as the app-level resource "sql-warehouse" in the Apps UI. It is NOT
# declared here: a valueFrom in env can only reference resources that
# exist at app level, so the binding below uses that resource name.

env:
- name: STREAMLIT_GATHER_USAGE_STATS
  value: 'false'
- name: DATABRICKS_SQL_WAREHOUSE_ID
  valueFrom: sql-warehouse
- name: DATA_MANAGEMENT_ADMINS
  value: 'baratha723@gmail.com'
